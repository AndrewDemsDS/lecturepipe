# Per-course transcription settings, one line per course:
#   CODE | lang | glossary [| notes=off]
#
# CODE     What you type as the first argument of lecture-record. Case-insensitive.
# lang     Whisper language code: en, el, de, fr, ... Avoid "auto": Whisper detects
#          once and can flip a whole lecture into a translation.
# glossary Terms the model should spell correctly: lecturer names, tool names,
#          acronyms. It is carried through the ENTIRE recording. Keep it under
#          about 40 terms. Whisper's context is capped at 224 tokens, so the
#          glossary gets at most 223 and Whisper keeps the end of a longer one.
# notes=off  transcribe only, skip the notes pass for this course.
#
# Unknown codes fall back to the DEFAULT row.

CS101   | en | Introduction to Programming. Terms: Python, variable, function, loop, list, dictionary, recursion, Big-O.
NET301  | en | Computer Networks, Prof. Example. Terms: TCP, UDP, IP, DNS, HTTP, TLS, BGP, OSPF, NAT, MTU, latency, throughput.
HIST210 | en | Modern European History | notes=off

DEFAULT | en | University lecture.
